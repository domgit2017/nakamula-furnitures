<main id="app"></main>

<script>
const S=SITE,$=s=>document.querySelector(s),KSh=n=>"KSh "+Number(n).toLocaleString("en-KE");
const IM=(id,w,h)=>`https://res.cloudinary.com/${S.cloud}/image/upload/f_auto,q_auto,${h?`c_fill,g_auto,w_${w},h_${h}`:`c_limit,w_${w}`}/${id}`;
const wal=t=>`https://wa.me/${S.wa}?text=${encodeURIComponent(t)}`;
const enq=n=>wal(`Hello Nakamula Furnitures, I am interested in your ${n}. Kindly share more details and pricing.`);
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DT=document.title;let P=[],view="grid",F={q:"",cat:"",sort:"new",n:12};
const vis=()=>P.filter(p=>!p.hidden),pr=p=>p.price?KSh(p.price):"Enquire for price";
const PH='<svg class="im ph" viewBox="0 0 200 150"><rect x="40" y="70" width="120" height="40" rx="10" fill="#a9794b"/><rect x="30" y="90" width="22" height="40" rx="8" fill="#a9794b"/><rect x="148" y="90" width="22" height="40" rx="8" fill="#a9794b"/></svg>';
const pic=(p,w=400,h=300)=>p.images[0]?`<img class="im" loading="lazy" width="${w}" height="${h}" src="${IM(p.images[0],w,h)}" alt="${esc(p.name)} - ${esc(p.category)} | Nakamula Furnitures, Githurai 45">`:PH;
$("#wa").href=wal("Hello Nakamula Furnitures, I would like to enquire about your furniture.");
function card(p){return`<div class="card"><a href="#p-${p.id}">${pic(p)}</a><div class="cb"><div class="mu">${esc(p.category)}</div><h3 style="font-size:17px">${esc(p.name)}</h3><div class="pr"><b>${pr(p)}</b></div><div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap"><a class="btn o s" href="#p-${p.id}">View Details</a><a class="btn g s" target="_blank" rel="noopener" href="${enq(p.name)}">WhatsApp Enquiry</a></div></div></div>`}
function home(){const v=vis(),f=v.filter(p=>p.featured),b=(f.length?f:v).slice(0,8);
return`<div class="hero"><div class="w"><h1>Make Your House a Home with Nakamula Furnitures</h1><p>Quality and stylish furniture for every home. Find the perfect furniture to transform your living space.</p><a class="btn" href="#shop">Explore Our Furniture</a> <a class="btn o" href="${wal("Hello Nakamula Furnitures, I would like to enquire about your furniture.")}" target="_blank" rel="noopener">Chat With Us on WhatsApp</a></div></div>
<section><div class="w"><h2 class="ttl">Featured Categories</h2><div class="grid">${S.cats.slice(0,5).map(c=>{const p=v.find(x=>x.category==c&&x.images[0]);return`<a class="cat" href="#shop" onclick="F.cat='${c}'">${p?`<img loading="lazy" width="300" height="225" src="${IM(p.images[0],300,225)}" alt="${c}">`:""}<h3>${c}</h3><span class="mu">${v.filter(x=>x.category==c).length} items</span></a>`}).join("")}</div></div></section>
<section><div class="w"><h2 class="ttl">Featured Products</h2>${b.length?`<div class="grid">${b.map(card).join("")}</div><p style="text-align:center;margin-top:20px"><a class="btn o" href="#shop">View all furniture</a></p>`:`<p class="mu">Our catalogue is being updated. Chat with us on WhatsApp to see our latest furniture.</p>`}</div></section>
<section><div class="w"><h2 class="ttl">Why Choose Us?</h2><div class="why">${[["Wide range","Beds, sofas, dining sets, wardrobes and more."],["Suits your budget","Furniture for every home and budget."],["Easy enquiries","Tap WhatsApp on any item for details and pricing."],["Visit our shop","Thika Road, Githurai 45, next to Riflo Building."]].map(x=>`<div><b>${x[0]}</b><br><span class="mu">${x[1]}</span></div>`).join("")}</div></div></section>
<section id="about"><div class="w" style="max-width:760px"><h2 class="ttl">About Nakamula Furnitures</h2><p>At Nakamula Furnitures, we provide a variety of household furniture to help make your home comfortable, stylish and beautiful. From elegant beds to comfortable sofa sets and other home furnishings, we aim to help every customer find furniture that suits their home and budget.</p></div></section>
<section id="contact"><div class="w"><h2 class="ttl">Visit or Contact Us</h2><div class="two"><div><h3>Nakamula Furnitures</h3><p><b>Location:</b><br>Thika Road, Githurai 45, near the roundabout, next to Riflo Building, Nairobi.</p><p><b>Phone / WhatsApp:</b> <a href="tel:+${S.wa}">0728752586</a></p><a class="btn" href="tel:+${S.wa}">Call Now</a> <a class="btn g" target="_blank" rel="noopener" href="${wal("Hello Nakamula Furnitures, I would like to enquire about your furniture.")}">WhatsApp</a> <a class="btn o" target="_blank" rel="noopener" href="${S.maps}">Get Directions</a></div>
<iframe loading="lazy" title="Nakamula Furnitures location map" src="https://www.google.com/maps?q=Riflo+Building+Githurai+45+Nairobi&output=embed"></iframe></div></div></section>`}
function shop(){const q=F.q.toLowerCase();let L=vis().filter(p=>(!F.cat||p.category==F.cat)&&(p.name+p.category+(p.description||"")).toLowerCase().includes(q));
if(F.sort=="low")L.sort((a,b)=>(a.price||1e12)-(b.price||1e12));if(F.sort=="high")L.sort((a,b)=>(b.price||0)-(a.price||0));
return`<section><div class="w"><h2 class="ttl">Our Furniture</h2><div class="bar"><input placeholder="Search furniture…" value="${esc(F.q)}" oninput="F.q=this.value;F.n=12;rs()" id="sq">
<select onchange="F.cat=this.value;F.n=12;rs()"><option value="">All categories</option>${S.cats.map(c=>`<option ${F.cat==c?"selected":""}>${c}</option>`).join("")}</select>
<select onchange="F.sort=this.value;rs()"><option value="new">Newest</option><option value="low" ${F.sort=="low"?"selected":""}>Price: low to high</option><option value="high" ${F.sort=="high"?"selected":""}>Price: high to low</option></select>
<button class="btn o s" onclick="view=view=='grid'?'list':'grid';rs()">${view=="grid"?"List":"Grid"} view</button></div>
<div class="${view=="list"?"list":""}">${L.length?`<div class="grid">${L.slice(0,F.n).map(card).join("")}</div>`:`<p class="mu">No furniture found. <a href="#shop" onclick="F={q:'',cat:'',sort:'new',n:12}">Clear filters</a> or <a target="_blank" rel="noopener" href="${wal("Hello Nakamula Furnitures, do you have this furniture: "+F.q)}">ask us on WhatsApp</a>.</p>`}</div>
${L.length>F.n?`<p style="text-align:center"><button class="btn o" onclick="F.n+=12;rs()">Load more</button></p>`:""}</div></section>`}
function rs(){const a=document.activeElement.id;render();if(a=="sq"){const e=$("#sq");e.focus();e.setSelectionRange(99,99)}}
function detail(id){const p=P.find(x=>x.id==id);if(!p)return"<div class='w'><p>Product not found. <a href='#shop'>Browse furniture</a></p></div>";
document.title=p.name+" | Nakamula Furnitures, Githurai 45 Nairobi";
$("#ld").textContent=JSON.stringify({"@context":"https://schema.org","@type":"Product",name:p.name,category:p.category,description:p.description||p.name+" - "+p.category+" at Nakamula Furnitures, Githurai 45, Nairobi",image:p.images.map(m=>IM(m,1000)),offers:{"@type":"Offer",priceCurrency:"KES",price:p.price||undefined,availability:"https://schema.org/InStock",seller:{"@type":"Organization",name:"Nakamula Furnitures"}}});
const rel=vis().filter(x=>x.category==p.category&&x.id!=p.id).slice(0,3);
return`<section><div class="w"><a href="#shop" class="mu">← Back to our furniture</a><div class="two" style="margin-top:14px"><div><div class="card" onmousemove="zoom(event)" onmouseleave="this.firstChild.style.transform=''" style="overflow:hidden">${p.images[0]?`<img id="mm" class="im" style="transition:transform .2s;object-fit:contain" src="${IM(p.images[0],1000)}" alt="${esc(p.name)} - ${esc(p.category)} | Nakamula Furnitures">`:PH}</div>
<div class="th">${p.images.length>1?p.images.map(m=>`<img src="${IM(m,140,104)}" alt="${esc(p.name)} photo" onclick="mm.src='${IM(m,1000)}'">`).join(""):""}</div></div>
<div><div class="mu">${esc(p.category)}</div><h1 style="font-size:32px;margin:4px 0">${esc(p.name)}</h1><div class="pr" style="margin:10px 0"><b style="font-size:26px">${pr(p)}</b></div><p>${esc(p.description)||"Quality furniture from Nakamula Furnitures."}</p>
<p><a class="btn g" target="_blank" rel="noopener" href="${enq(p.name)}">WhatsApp Enquiry</a> <a class="btn" href="tel:+${S.wa}">Call Now</a></p><p class="mu">Visit us: Thika Road, Githurai 45, next to Riflo Building.</p></div></div>
${rel.length?`<h2 class="ttl" style="margin-top:34px">You may also like</h2><div class="grid">${rel.map(card).join("")}</div>`:""}</div></section>`}
function zoom(e){const r=e.currentTarget.getBoundingClientRect(),t=e.currentTarget.firstChild;if(t.tagName!="IMG")return;t.style.transformOrigin=((e.clientX-r.left)/r.width*100)+"% "+((e.clientY-r.top)/r.height*100)+"%";t.style.transform="scale(1.8)"}
function quote(){return`<section><div class="w"><h2 class="ttl">Custom Furniture Quote</h2><div class="f"><label>What furniture are you looking for?<textarea id="qd" rows="3" placeholder="e.g. 6-seater dining table, 5x6 bed, wardrobe"></textarea></label><label>Your name<input id="qn"></label><button class="btn g" onclick="window.open(wal('Hello Nakamula Furnitures, this is '+($('#qn').value||'a customer')+'. I am looking for: '+$('#qd').value))">Request quote on WhatsApp</button></div></div></section>`}
function render(){const h=(location.hash||"#home").slice(1);document.title=DT;$("#ld").textContent="";let v;
if(h.startsWith("p-"))v=detail(h.slice(2));else if(h=="shop")v=shop();else if(h=="quote")v=quote();else v=home();
$("#app").innerHTML=v;if(h=="about"||h=="contact")document.getElementById(h).scrollIntoView()}
addEventListener("hashchange",()=>{render();if(!/^#(about|contact)$/.test(location.hash))scrollTo(0,0)});
fetch("products.json?v="+Date.now()).then(r=>r.json()).then(d=>{P=d.products||[]}).catch(()=>{}).finally(render);
</script></body></html>
